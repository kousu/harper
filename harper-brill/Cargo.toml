[package]
name = "harper-brill"
version = "3.1.0"
edition = "2024"
description = "The language checker for developers."
license = "Apache-2.0"
repository = "https://github.com/automattic/harper"

[features]
default = ["en"]
# Bundle the English tagger and chunker models, including the neural chunker.
en = ["harper-pos-utils/burn"]

[dependencies]
harper-pos-utils = { path = "../harper-pos-utils/", version = "3.0.0" }
serde_json = "1.0.150"

[build-dependencies]
serde_json = "1.0.150"
